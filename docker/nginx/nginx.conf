# ─────────────────────────────────────────────────────────────────────────────
# ChainWatch — Nginx configuration
#
# Routing:
#   /api/*   → upstream backend:8000   (FastAPI, internal only)
#   /        → frontend static files   (React dist/, served by this nginx)
#
# Ports exposed to host: 80  (443 is declared in docker-compose for TLS readiness)
# Internal services (backend, neo4j, generator) are NOT exposed on the host.
# ─────────────────────────────────────────────────────────────────────────────

# Number of worker processes — auto lets nginx use the available CPU count.
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Upstream: FastAPI backend ────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── /api/* → FastAPI ─────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward the API key header transparently
            proxy_set_header   X-API-Key         $http_x_api_key;

            # Allow large CSV uploads (default nginx limit is 1MB)
            client_max_body_size 60m;

            # Give the backend time for the synchronous ingest pipeline
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_connect_timeout 10s;
        }

        # ── React SPA — all non-/api/ paths ──────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;

            # HTML5 history API routing — unknown paths fall back to index.html
            try_files $uri $uri/ /index.html;
        }

        # ── Static asset caching ──────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            root       /usr/share/nginx/html;
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-XSS-Protection       "1; mode=block" always;
    }
}
