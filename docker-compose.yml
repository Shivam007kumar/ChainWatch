# ─────────────────────────────────────────────────────────────────────────────
# ChainWatch — Docker Compose
#
# Normal startup (Neo4j + backend + frontend/nginx):
#   docker compose up -d --build
#
# Services (normal):
#   neo4j      — Neo4j 5.12.0, bolt://neo4j:7687 (internal only)
#   backend    — FastAPI, port 8000 (internal only)
#   frontend   — nginx:alpine serving React dist/ + reverse-proxying /api/*
#                Sole public entry point → host:80 (HTTP; TLS is not configured)
#
# Environment:
#   Copy chainwatch_backend/.env.example → chainwatch_backend/.env
#   Set NEO4J_PASSWORD, API_KEY, and DEMO_MODE=true for the static demo.
#
# Data persistence:
#   Neo4j data lives in named Docker volumes (neo4j_data, neo4j_logs, …).
#   `docker compose down` preserves volumes.  `docker compose down -v` wipes them.
#   Do NOT run `down -v` unless you intend to delete all graph data.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Neo4j 5.12.0 ───────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.12.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD and pass --env-file chainwatch_backend/.env}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      # wget is present in neo4j:5.12.0 — confirmed in docker-compose audit
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 6
    networks:
      - chainwatch

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      # Reads all settings from chainwatch_backend/.env.
      # NEO4J_URI is overridden below to ensure the container service name is used.
      - chainwatch_backend/.env
    environment:
      # Force inter-container Neo4j address.  This overrides any value in .env.
      NEO4J_URI: "bolt://neo4j:7687"
    depends_on:
      neo4j:
        condition: service_healthy
    # Not exposed on host — all traffic routes through the frontend/nginx service.
    expose:
      - "8000"
    networks:
      - chainwatch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  # ── Frontend + Nginx (public entry point) ───────────────────────────────────
  # This image bakes in:
  #   1. The React production build (dist/) served as static files
  #   2. The nginx.conf reverse proxy (/ → static, /api/* → backend:8000)
  # It is the ONLY service exposing ports to the host.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # /api/v1 = same-origin path.  Browser sends GET /api/v1/stats,
        # nginx proxies it to http://backend:8000/api/v1/stats.
        VITE_API_BASE: /api/v1
        VITE_API_KEY: ${API_KEY:?Set API_KEY and pass --env-file chainwatch_backend/.env}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chainwatch

# ── Named volumes ──────────────────────────────────────────────────────────────
# Persist Neo4j data across container restarts and `docker compose down`.
# Only destroyed by: docker compose down -v
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:

# ── Network ─────────────────────────────────────────────────────────────────
networks:
  chainwatch:
    driver: bridge
